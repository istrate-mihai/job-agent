agent:
  enabled: true
  llmEnabled: true
  dailyTokenBudget: 1500000

llm:
  maxRetryWaitSec: 30 # on HTTP 429, wait up to this long once, then fall through to the next route

  providers:
    groq: # free, no card; limits are per model, so different models spread the quota
      kind: openai-compatible
      baseUrl: https://api.groq.com/openai/v1
      apiKeyEnv: GROQ_API_KEY
      toolMode: forced
    gemini: # free tier via AI Studio; ⚠ free-tier prompts may be used by Google to improve products
      kind: openai-compatible
      baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
      apiKeyEnv: GEMINI_API_KEY
      toolMode: forced
    openrouter: # ":free" models; tool support varies per model, so JSON mode
      kind: openai-compatible
      baseUrl: https://openrouter.ai/api/v1
      apiKeyEnv: OPENROUTER_API_KEY
      toolMode: json
    ollama: # local, fully private, no limits; speed depends on your hardware
      kind: openai-compatible
      baseUrl: http://localhost:11434/v1
      apiKeyEnv: null
      toolMode: json
    anthropic: # paid; add routes back once you have API credit
      kind: anthropic
      apiKeyEnv: ANTHROPIC_API_KEY

  # Routes are tried top to bottom. A route whose API key is missing is skipped automatically.
  # Model IDs change: confirm them in each provider's console/model list.
  tasks:
    extraction:
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: llama-3.3-70b-versatile }
      - { provider: gemini, model: gemini-2.5-flash-lite }
      - { provider: ollama, model: qwen2.5:7b }
      # - { provider: anthropic, model: claude-haiku-4-5-20251001 }
    scoring:
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: llama-3.3-70b-versatile }
      - { provider: gemini, model: gemini-2.5-flash-lite }
      # - { provider: anthropic, model: claude-haiku-4-5-20251001 }
    tailoring: # keep CV content off free tiers that train on prompts (see gemini note)
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: llama-3.3-70b-versatile }
      - { provider: ollama, model: qwen2.5:7b }
      # - { provider: anthropic, model: claude-opus-5-5 }

sources:
  gmail:
    enabled: true
    # Senders of your job-alert emails. Check the "From" of one real alert per board and adjust.
    query: "from:(jobalerts-noreply@linkedin.com OR ejobs.ro OR bestjobs.eu)"
    lookbackDays: 3
    maxMessages: 30
  remotive:
    enabled: true
    categories: [software-dev]
  # Board token from a careers link: boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
  greenhouse: []
  # Slug from a careers link: jobs.lever.co/<slug> (jobs.eu.lever.co/<slug> → region: eu)
  lever: []

locations:
  remoteScopeAllow: [worldwide, anywhere, global, europe, emea, eu, eea, romania, cet]
  countryFallback: romania
  tierA:
    - { name: Brașov, aliases: [brasov] }
  tierB: # relocation targets; triggers the relocation line in CV + cover note
    - { name: București, aliases: [bucuresti, bucharest] }
    - { name: Craiova, aliases: [] }
    - { name: Cluj-Napoca, aliases: [cluj] }
    - { name: Iași, aliases: [iasi] }
    - { name: Timișoara, aliases: [timisoara] }
    - { name: Sibiu, aliases: [] }
    - { name: Oradea, aliases: [] }

titles:
  include: [full stack, fullstack, full-stack, web developer, software engineer, software developer, backend, back-end, frontend, front-end, php developer, laravel, node.js, nodejs, vue, react, programator, dezvoltator, inginer software]
  exclude: [principal, staff, architect, head of, director, intern, internship]

seniority:
  target: mid
  allow: [junior-mid, mid, mid-senior]

maxPostingAgeDays: 14

stackWeights:
  laravel: 1.0
  php: 1.0
  vue: 1.0
  react: 0.9
  typescript: 0.9
  node: 0.9
  mongodb: 0.6
  docker: 0.5
  llm: 0.5

languageFlags: [german, french, dutch] # mandatory ones get flagged, not auto-rejected

companies:
  allowlist: [Tremend, Endava, NTT Data, Siemens]
  blocklist: []

limits:
  dailyApprovals: 5
  perCompanyCooldownDays: 30

scoring:
  tailorThreshold: 70 # >= this → "apply"
  reviewThreshold: 50 # >= this → "maybe", below → "skip"
  batchSize: 25 # postings scored per run (free tiers: keep modest)
  maxDescriptionChars: 6000 # ⚡ Perf: long postings are mostly boilerplate after this
  careerGoals: "Mid-level full-stack roles on PHP/Laravel, Node.js/TypeScript, Vue or React; growth toward DevOps and LLM/agentic systems."

digest:
  limit: 10 # postings shown per digest
