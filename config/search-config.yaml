agent:
  enabled: true
  llmEnabled: true
  dailyTokenBudget: 1500000

llm:
  maxRetryWaitSec: 30 # on HTTP 429, wait up to this long once, then fall through to the next route

  providers:
    groq: # free, no card; limits are per model, so different models spread the quota
      kind: openai-compatible
      baseUrl: https://api.groq.com/openai/v1
      apiKeyEnv: GROQ_API_KEY
      reasoningEffort: low # gpt-oss thinks less, leaving tokens for the JSON answer
      toolMode: forced
    gemini: # free tier via AI Studio; ⚠ free-tier prompts may be used by Google to improve products
      kind: openai-compatible
      baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
      apiKeyEnv: GEMINI_API_KEY
      toolMode: forced
    openrouter: # ":free" models; tool support varies per model, so JSON mode
      kind: openai-compatible
      baseUrl: https://openrouter.ai/api/v1
      apiKeyEnv: OPENROUTER_API_KEY
      toolMode: json
    ollama: # local, fully private, no limits; speed depends on your hardware
      kind: openai-compatible
      baseUrl: http://localhost:11434/v1
      apiKeyEnv: null
      toolMode: json
    anthropic: # paid; add routes back once you have API credit
      kind: anthropic
      apiKeyEnv: ANTHROPIC_API_KEY

  # Routes are tried top to bottom. A route whose API key is missing is skipped automatically.
  # Model IDs change: run `npm run llm:models` to see which IDs your keys can use.
  tasks:
    extraction:
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: openai/gpt-oss-20b }
      - { provider: gemini, model: gemini-3.5-flash-lite }
      - { provider: ollama, model: qwen2.5:7b }
      # - { provider: anthropic, model: claude-haiku-4-5-20251001 }
    scoring:
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: groq, model: openai/gpt-oss-20b }
      - { provider: gemini, model: gemini-3.5-flash-lite }
      # - { provider: anthropic, model: claude-haiku-4-5-20251001 }
    tailoring: # keep CV content off free tiers that train on prompts (see gemini note)
      - { provider: groq, model: openai/gpt-oss-120b }
      - { provider: gemini, model: gemini-3.5-flash-lite }
      - { provider: groq, model: openai/gpt-oss-20b }
      - { provider: ollama, model: qwen2.5:7b }
      # - { provider: anthropic, model: claude-opus-5-5 }

sources:
  jobicy: # remote jobs open to Romania/Europe (keep the Jobicy link when applying)
    enabled: true
    geos: [romania, europe]
  smartrecruiters: # companyId from careers.smartrecruiters.com/<companyId>
    - { company: Endava, companyId: Endava, country: ro }
  gmail:
    enabled: true
    # Senders of your job-alert emails. Check the "From" of one real alert per board and adjust.
    query: "from:(jobalerts-noreply@linkedin.com OR ejobs.ro OR bestjobs.eu OR teamtailor-mail.com OR indeed.com) -from:noutati-companii@mta.ejobs.ro"
    lookbackDays: 7
    maxMessages: 30
  remotive:
    enabled: true
    categories: [software-dev]
  # Board token from a careers link: boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
  greenhouse: []
  # Slug from a careers link: jobs.lever.co/<slug> (jobs.eu.lever.co/<slug> → region: eu)
  lever: []
  # Find an employer's feed with: npm run ats:probe -- <careers-page-url | "Company Name">
  # and paste the printed line here. A wrong slug fails that source every run, so only add probed ones.
  # Not covered by feeds (no public API): Siemens (Avature), NTT DATA (Phenom), Workday/SuccessFactors
  # employers → keep LinkedIn/eJobs alerts for them in Gmail.
  workable: [] # slug from apply.workable.com/<slug>/
  recruitee: [] # slug from <slug>.recruitee.com
  personio: [] # slug from <slug>.jobs.personio.de (domain: com for .jobs.personio.com)
  # Public, attribution-only RSS feeds. No robots.txt concern: these are published for reuse.
  # Wellfound/AngelList has no public API and blocks scraping (robots.txt + Cloudflare) — not worth fighting;
  # most of its startup postings also surface via greenhouse/lever/workable above.
  rss:
    - { name: weworkremotely-fullstack, url: https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss }
    - { name: weworkremotely-backend, url: https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss }
    - { name: weworkremotely-frontend, url: https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss }
    - { name: weworkremotely-devops, url: https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss }
  # Public listing pages of job boards. robots.txt is honored; pages are fetched 2s apart.
  # JSON-LD on the page is used when present, otherwise the extraction LLM reads the page (new links only).
  # eJobs and BestJobs stay on email alerts (gmail above): JS-heavy pages, alerts are more reliable.
  # Undelucram.ro is a salary/review site, not a job board — not worth scraping for postings.
  boards:
    - name: juniors # junior/entry focus; overlaps LinkedIn (dedupe handles it)
      urls:
        - https://www.juniors.ro/jobs/web-development
        - https://www.juniors.ro/jobs/programming
        - https://www.juniors.ro/jobs/devops
      linkPattern: "^https://(www\\.)?juniors\\.ro/jobs/\\d+"
    - name: hipo
      urls:
        - https://www.hipo.ro/locuri-de-munca/cautajob/IT-Software/Brasov
        - https://www.hipo.ro/locuri-de-munca/cautajob/IT-Software/Bucuresti
      linkPattern: "^https://(www\\.)?hipo\\.ro/locuri-de-munca/locuri_de_munca/\\d+/"
    - name: devjob # DevJobRomania: Romanian tech-only board, filterable by stack/city
      urls:
        - https://devjob.ro/jobs/all/Brasov
        - https://devjob.ro/jobs/all/Bucuresti
      linkPattern: "^https://(www\\.)?devjob\\.ro/jobs/[^/]+-[^/]+"
      extract: auto

locations:
  remoteScopeAllow: [worldwide, anywhere, global, europe, emea, eu, eea, romania, cet]
  countryFallback: romania
  tierA:
    - { name: Brașov, aliases: [brasov] }
  tierB: # relocation targets; triggers the relocation line in CV + cover note
    - { name: București, aliases: [bucuresti, bucharest] }
    - { name: Craiova, aliases: [] }
    - { name: Cluj-Napoca, aliases: [cluj] }
    - { name: Iași, aliases: [iasi] }
    - { name: Timișoara, aliases: [timisoara] }
    - { name: Sibiu, aliases: [] }
    - { name: Oradea, aliases: [] }

titles:
  include: [full stack, fullstack, full-stack, web developer, software engineer, software developer, backend, back-end, frontend, front-end, php developer, laravel, node.js, nodejs, vue, react, programator, dezvoltator, inginer software]
  exclude: [principal, staff, architect, head of, director, intern, internship]

seniority:
  target: mid
  allow: [junior, junior-mid, mid, mid-senior]
  belowLevel: accept # junior or lower-paid roles are never scored down; you decide

maxPostingAgeDays: 14

stackWeights:
  laravel: 1.0
  php: 1.0
  vue: 1.0
  react: 0.9
  typescript: 0.9
  node: 0.9
  mongodb: 0.6
  docker: 0.5
  llm: 0.5

languageFlags: [german, french, dutch] # mandatory ones get flagged, not auto-rejected

companies:
  allowlist: [Tremend, Endava, NTT Data, Siemens]
  blocklist: []

limits:
  dailyApprovals: 5
  perCompanyCooldownDays: 30

scoring:
  tailorThreshold: 70 # >= this → "apply"
  reviewThreshold: 50 # >= this → "maybe", below → "skip"
  batchSize: 25 # postings scored per run (free tiers: keep modest)
  maxDescriptionChars: 6000 # ⚡ Perf: long postings are mostly boilerplate after this
  careerGoals: "Full-stack roles from junior to mid level on PHP/Laravel, Node.js/TypeScript, Vue or React; growth toward DevOps and LLM/agentic systems."

digest:
  limit: 10 # postings shown per digest

tailoring:
  outputDir: output/applications
  batchSize: 5
  maxPages: 2
  maxProjects: 4
  minBullets: 20
  maxDescriptionChars: 4000
  photoPath: data/photo.jpg

